name: 定期访问并点击页面中心（使用 cloakbrowser）

on:
  schedule:
    # 每10分钟运行一次
    - cron: '*/10 * * * *'
  workflow_dispatch:   # 允许手动触发

jobs:
  cloak-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码（无需仓库内容，仅用于保留工作区）
        uses: actions/checkout@v4

      - name: 安装系统依赖（包括虚拟显示器 Xvfb）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 cloakbrowser
        run: |
          pip install cloakbrowser

      - name: 运行自动化脚本（在虚拟显示器内）
        env:
          SECRET_URL: ${{ secrets.MY_SECRET_URL }}
        run: |
          xvfb-run --auto-servernum python - << 'EOF'
          import sys
          import time
          import os
          from cloakbrowser import launch

          target_url = os.environ.get('SECRET_URL')
          if not target_url:
              print("❌ 请设置 SECRET_URL 环境变量")
              sys.exit(1)

          print(f"🔗 准备访问: {target_url}")
          print("🚀 正在启动 cloakbrowser（源码级反检测浏览器）...")

          try:
              # 启动一个完全真实的浏览器窗口（无头模式关闭）
              browser = launch(
                  headless=False,          # 必须 False，搭配虚拟显示器使用
                  humanize=True,           # 模拟人类行为
                  ignore_default_args=['--disable-dev-shm-usage'],
              )
              print("✅ 浏览器已启动")

              page = browser.new_page()
              print(f"🌐 正在访问目标网址...")
              page.goto(target_url)
              page.wait_for_load_state('networkidle')
              print("✅ 页面加载完成")

              # 连续点击页面正中央（5次）
              click_times = 5
              print(f"🖱️  准备连续点击页面中心 {click_times} 次")

              for i in range(click_times):
                  # 获取视口尺寸，计算中心坐标
                  viewport = page.viewport_size
                  if viewport is None:
                      viewport = {'width': 1280, 'height': 720}
                  center_x = viewport['width'] // 2
                  center_y = viewport['height'] // 2

                  # 模拟鼠标移动 + 点击
                  page.mouse.move(center_x, center_y)
                  time.sleep(0.1)
                  page.mouse.click(center_x, center_y)
                  print(f"   👆 第 {i+1}/{click_times} 次点击，坐标 ({center_x}, {center_y})")
                  time.sleep(0.5)   # 自然间隔

              print("✅ 所有操作完成，关闭浏览器")
              browser.close()
              print("🎉 脚本执行成功")

          except Exception as e:
              print(f"💥 执行失败: {e}")
              sys.exit(1)
          EOF
